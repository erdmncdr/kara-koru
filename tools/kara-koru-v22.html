<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Kara Koru</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Alegreya+Sans:wght@400;500;700;800&family=Noto+Sans+Old+Turkic&display=swap" rel="stylesheet">
<style>
:root{--bone:#ddd3bc;--dim:#a0978a;--iron:#5e5850;--blood:#a3241c;--soul:#a8e3d6;--gold:#e2b04a;--ember:#e2702c;--ink:#1b1410;
 --dsp:"Grenze Gotisch",Georgia,serif;--txt:"Grenze",Georgia,serif;--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1d1630;color:var(--bone);font:400 16px/1.45 var(--txt);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.cd:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
kbd{font:600 13px/1 var(--txt);color:var(--bone);box-shadow:inset 0 0 0 1px var(--iron);padding:3px 7px 4px;border-radius:2px;white-space:nowrap}

/* hud */
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.85)}
body:not(.on) #hud,body:not(.on) #wls{display:none}
#lt{position:absolute;top:calc(16px + var(--top));left:16px;width:min(300px,44vw)}
#hpw{position:relative;height:20px;background:rgba(24,10,8,.78);box-shadow:0 0 0 1px var(--iron)}
#hp{display:block;height:100%;width:100%;background:var(--blood);transition:width .15s}
#hpt{position:absolute;inset:0;display:flex;align-items:center;padding-left:8px;font:600 15px/1 var(--txt)}
#dsh{margin-top:5px;width:90px;height:4px;background:rgba(24,10,8,.78)}#dshf{display:block;height:100%;background:var(--soul)}
#au{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--gold)}#au svg{width:30px;height:30px}
#auv{font:600 32px/1 var(--txt);font-variant-numeric:tabular-nums}#aun{align-self:flex-end;margin:0 0 3px 4px;font-size:14px;color:var(--dim)}
#bf{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-size:15px}
#obj{display:none;margin-top:14px;padding:10px 12px 12px;background:rgba(16,12,10,.8);box-shadow:inset 0 0 0 1px var(--iron);font-size:15px;line-height:1.3;text-shadow:none}
#obj b{display:block;margin-bottom:4px;font:500 21px/1.1 var(--dsp)}
#obj div{display:flex;gap:9px;align-items:baseline;margin-top:6px}#obj i{flex:none;width:11px;height:11px;box-shadow:inset 0 0 0 1.5px var(--dim)}
#obj .ok{color:var(--dim)}#obj .ok i{background:var(--soul);box-shadow:none}
#ct{position:absolute;top:calc(10px + var(--top));left:50%;transform:translateX(-50%);width:min(520px,44vw);text-align:center}
#tm{font:600 28px/1 var(--txt);font-variant-numeric:tabular-nums}
#xpw{display:flex;align-items:center;gap:10px;margin-top:8px}
#lvb{flex:none;min-width:42px;height:42px;padding:0 6px;display:grid;place-items:center;font:600 22px/1 var(--txt);color:var(--soul);background:rgba(16,12,10,.85);box-shadow:inset 0 0 0 1px var(--soul)}
#xpm{flex:1;text-align:left}.xl{display:flex;justify-content:space-between;margin:0 0 3px;font-size:13px;color:var(--dim)}
#xpbar{height:10px;background:rgba(0,0,0,.55);box-shadow:0 0 0 1px var(--iron)}#xp{display:block;height:100%;width:0;background:var(--soul)}
#bb{display:none;margin-top:10px}#bn{font:500 24px/1 var(--dsp)}
#bb div{height:8px;margin-top:6px;background:rgba(24,10,8,.8);box-shadow:0 0 0 1px var(--iron)}#bh{display:block;height:100%;background:var(--blood)}
#rt{position:absolute;top:calc(16px + var(--top));right:16px;text-align:right;font-size:15px}
#mm{display:block;width:132px;height:132px;margin:0 0 6px auto;border-radius:50%;background:rgba(16,12,10,.6);box-shadow:0 0 0 1px var(--iron)}
#bl{position:absolute;left:16px;bottom:calc(16px + var(--bot));max-width:calc(100% - 140px)}
.bld{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;text-align:left}
.bl{display:block;margin-bottom:4px;font-size:13px;color:var(--dim)}
.br{display:flex;flex-wrap:wrap;gap:5px}
.sl{position:relative;width:50px;height:50px;display:grid;place-items:center;color:var(--ember);background:rgba(16,12,10,.86);box-shadow:inset 0 0 0 1px var(--iron);text-shadow:none}
.sl svg{width:30px;height:30px}.sl b{position:absolute;right:3px;bottom:2px;font:600 13px/1 var(--txt);color:var(--bone)}
.sl.tm{color:var(--soul)}.sl.e{background:rgba(16,12,10,.35);box-shadow:inset 0 0 0 1px rgba(94,88,80,.45)}
.it{position:relative;width:36px;height:36px;display:grid;place-items:center;color:var(--rc);background:rgba(16,12,10,.86);box-shadow:inset 0 0 0 1.5px var(--rc);text-shadow:none}
.it svg{width:22px;height:22px}.it b{position:absolute;right:2px;bottom:1px;font:600 11px/1 var(--txt);color:var(--bone)}
#wls{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.wl{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;font-size:15px;line-height:1.25;text-shadow:0 1px 3px #000,0 0 2px #000}
.wl span{display:block;font-weight:600}.wl .p{font-size:19px;color:var(--gold)}.wl .p.no{color:#d98070}.wl small{display:block;font-size:14px;opacity:.9}
#tt{position:fixed;top:calc(150px + var(--top));left:0;right:0;padding:0 16px;text-align:center;font:600 20px/1.3 var(--txt);text-shadow:0 2px 8px #000;pointer-events:none}
#fl{position:fixed;inset:0;background:#7a0f0a;opacity:0;pointer-events:none;transition:opacity .25s}
#vg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 62%,rgba(8,4,10,.38))}
.dn{position:fixed;font:700 19px/1 var(--txt);color:var(--bone);pointer-events:none;text-shadow:0 2px 3px #000,0 0 2px #000;transform:translate(-50%,-50%);animation:dnp .7s cubic-bezier(.2,.9,.3,1) both}@keyframes dnp{0%{scale:.35}18%{scale:1.35}34%{scale:.95}50%{scale:1}100%{scale:.85}}
.dn.c{font-size:30px;color:#ffcf4a;text-shadow:0 2px 3px #000,0 0 10px rgba(255,120,30,.9),0 0 2px #000;animation:dnc .75s cubic-bezier(.2,.9,.3,1) both}@keyframes dnc{0%{scale:.3;rotate:-8deg}16%{scale:1.6;rotate:4deg}32%{scale:1;rotate:0deg}100%{scale:.9}}

/* katmanlar */
#ov{position:fixed;inset:0;z-index:5;display:flex;overflow:auto}
#ov.h{display:none}
#ov.side{background:linear-gradient(90deg,rgba(14,10,9,.95),rgba(14,10,9,.84) 44%,rgba(14,10,9,0) 72%)}
#ov.mid{background:rgba(10,8,7,.86);justify-content:center;align-items:flex-start;padding:28px 16px}
#ov.mid>*{margin:auto 0}
.col{width:min(660px,100%);min-height:100%;padding:clamp(24px,6vh,72px) clamp(20px,5vw,72px);display:flex;flex-direction:column}.col>:first-child{margin-top:auto}.col>:last-child{margin-bottom:auto}
h1{margin:0 0 14px;font:500 clamp(56px,min(10vw,14vh),128px)/.86 var(--dsp);color:var(--bone)}
h2{margin:0;font:500 clamp(40px,5.5vw,60px)/1 var(--dsp)}
.lead{margin:0 0 24px;max-width:38ch;font-size:18px;color:var(--dim)}
.chs{display:flex;flex-direction:column;margin-bottom:22px}
.ch{all:unset;box-sizing:border-box;cursor:pointer;display:block;padding:5px 0}
.ch b{display:block;font:500 34px/1.05 var(--dsp);color:var(--dim)}
.ch:hover b,.ch.on b{color:var(--bone)}.ch:focus-visible{outline:2px solid var(--ember);outline-offset:4px}
.ch .cdsc,.ch .ckit{display:none}
.ch.on .cdsc{display:block;max-width:42ch;margin-top:4px;font-size:16px;color:var(--bone)}
.ch.on .ckit{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:15px;color:var(--dim)}
.ckit em{margin-left:4px;font-style:normal;color:var(--bone)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.act{border:0;border-radius:2px;padding:12px 22px;font:600 19px/1 var(--txt);background:var(--bone);color:var(--ink)}
.act:hover{background:#f3ead4}.act[disabled]{opacity:.4;cursor:default}
.act.alt{background:transparent;color:var(--bone);box-shadow:inset 0 0 0 1px var(--dim)}.act.alt:hover{background:rgba(221,211,188,.08)}
.act span{color:var(--dim);font-weight:500}.act kbd{color:var(--ink);box-shadow:inset 0 0 0 1px rgba(27,20,16,.5)}.act.alt kbd{color:var(--bone);box-shadow:inset 0 0 0 1px var(--iron)}
.best{font-size:15px;color:var(--dim)}
.loop{display:grid;gap:10px;max-width:48ch;margin-top:22px}.loop div{display:flex;gap:12px;align-items:flex-start}.loop p{margin:0;font-size:15px;color:var(--dim)}.loop b{color:var(--bone)}
.keys{display:grid;grid-template-columns:auto 1fr auto 1fr;align-items:baseline;gap:8px 12px;margin-top:24px;font-size:15px;color:var(--dim)}.keys kbd{justify-self:start}
.tch{display:none;margin-top:20px;font-size:15px;color:var(--dim)}
.ic{flex:none;width:56px;height:56px;display:grid;place-items:center;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px var(--iron)}.ic svg{width:34px;height:34px}
.ic.w{color:var(--ember)}.ic.t{color:var(--soul)}.ic.i{color:var(--rc)}.ic.g{color:var(--gold)}
.ckit .ic,.loop .ic{width:38px;height:38px}.ckit .ic svg,.loop .ic svg{width:23px;height:23px}
.lu{width:min(1000px,100%);text-align:center}
.sub{max-width:58ch;margin:8px auto 22px;font-size:17px;color:var(--dim)}
.cs{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.cd{position:relative;width:286px;min-height:270px;padding:0 18px 16px;display:flex;flex-direction:column;text-align:left;cursor:pointer;background:rgba(24,19,16,.97);box-shadow:inset 0 0 0 1px var(--iron),inset 0 3px 0 var(--rc)}
.cd:hover,.cd:focus-visible{box-shadow:inset 0 0 0 2px var(--rc),inset 0 3px 0 var(--rc)}
.rb{display:flex;justify-content:space-between;align-items:baseline;margin:0 -18px;padding:10px 18px 9px;font-size:14px;color:var(--dim);background:rgba(255,255,255,.04);background:color-mix(in srgb,var(--rc) 15%,transparent)}
.rb .rn{font-size:16px;font-weight:700;color:var(--rc)}
.hd{display:flex;align-items:center;gap:12px;margin-top:14px}
.n{font:600 22px/1.1 var(--txt);color:var(--bone)}.lv{margin-top:3px;font-size:14px;color:var(--dim)}
.rows{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.sr{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:17px;color:var(--bone)}
.sr b{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}.sr i{font-style:normal;color:var(--dim)}.sr em{font-style:normal;color:var(--rc)}
.cd .d{flex:1;margin:12px 0 0;font-size:15px;color:var(--dim)}
.ft{display:flex;justify-content:space-between;align-items:center;min-height:22px;margin-top:12px}
.ban{all:unset;cursor:pointer;font-size:13px;color:var(--dim);text-decoration:underline;text-underline-offset:3px}.ban:hover{color:var(--bone)}.ban:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.ctl{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;margin-top:22px}.ctl .hint{flex-basis:100%;font-size:14px;color:var(--dim)}
.lu .bld,.pz .bld{justify-content:center;margin-top:26px;padding-top:18px;border-top:1px solid rgba(94,88,80,.4)}
.pz{width:min(1000px,100%)}.pz>h2,.pz>.sub{text-align:center}.pz>.row{justify-content:center}
.pz h3{margin:26px 0 10px;font:500 26px/1 var(--dsp)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.wdt{padding:12px 14px;background:rgba(24,19,16,.95);box-shadow:inset 0 0 0 1px var(--iron)}.wdt .hd{margin:0 0 8px}.wdt .ic{width:44px;height:44px}.wdt .ic svg{width:26px;height:26px}.wdt .n{font-size:18px}.wdt .sr{font-size:15px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 28px}.sgrid .sr{padding:5px 0;font-size:15px;border-bottom:1px solid rgba(94,88,80,.35)}
.stats{display:flex;flex-wrap:wrap;gap:6px 30px;margin:4px 0 20px}.stats span{display:block;font-size:14px;color:var(--dim)}.stats b{font:600 30px/1.1 var(--txt);font-variant-numeric:tabular-nums}
.col .bld{margin-top:4px}
.mb{position:fixed;bottom:calc(26px + var(--bot));width:66px;height:66px;margin:0;padding:0;border-radius:50%;display:none;font:600 14px/1 var(--txt);color:var(--bone);background:rgba(20,15,12,.55);border:1px solid var(--dim)}
#bj{right:18px}#bs{right:96px}#bc{right:18px;bottom:calc(104px + var(--bot))}
@media (pointer:coarse){body.on .mb{display:block}.tch{display:block}.keys{display:none}}
@media (max-height:820px){.col{padding-top:20px;padding-bottom:20px}h1{font-size:min(10vw,11vh);margin-bottom:8px}.lead{margin-bottom:12px;font-size:17px}.chs{margin-bottom:12px}.ch{padding:3px 0}.ch b{font-size:28px}.loop{margin-top:12px;gap:6px}.loop p{font-size:14px}.loop .ic{width:32px;height:32px}.keys{margin-top:12px;gap:5px 12px;font-size:14px}.best{margin:8px 0 0}}
@media (max-width:760px){#ov.side,#ov.mid{background:rgba(14,10,9,.94)}.keys{grid-template-columns:auto 1fr}.ch b{font-size:30px}
 #ct{top:calc(6px + var(--top));left:12px;right:12px;width:auto;transform:none}#tm{font-size:20px}#xpw{margin-top:4px}#lvb{min-width:34px;height:34px;font-size:18px}
 #lt,#rt{top:calc(84px + var(--top))}#lt{left:12px}#rt{right:12px}#mm{width:92px;height:92px}#auv{font-size:26px}#obj{font-size:13px}
 #bl{left:12px;max-width:calc(100% - 110px)}.sl{width:40px;height:40px}.sl svg{width:24px;height:24px}.it{width:30px;height:30px}.bld{gap:6px 10px}
 .cd{width:100%;min-height:0}.cd .d{flex:none}.ic{width:46px;height:46px}.ic svg{width:28px;height:28px}}
@media (prefers-reduced-motion:reduce){#hp{transition:none}}
#ov.side .col>.row{position:sticky;bottom:0;z-index:1;margin-bottom:0;padding:12px 0 14px;background:linear-gradient(rgba(26,19,15,0),rgba(26,19,15,.97) 28%)}
@media (max-height:720px){.loop{display:none}}
body.nolk.on canvas{cursor:grab}body.nolk.on canvas:active{cursor:grabbing}

#tmr{display:flex;justify-content:center;align-items:baseline;gap:10px}#stn,#tml{font-size:14px;color:var(--dim)}#stn{color:var(--bone);font-weight:600}
#tm{font:600 28px/1 var(--txt);font-variant-numeric:tabular-nums}#tm.sw{color:#ef4a2e}
#goal{max-width:300px;margin:12px 0 0;padding:8px 10px;font-size:16px;line-height:1.3;background:rgba(16,12,10,.62);box-shadow:inset 3px 0 0 var(--ember);text-shadow:none}
#bf .g{color:var(--gold)}
.wl .gt{font:500 26px/1 var(--dsp);color:#ef6a4e}.wl .pt{font:500 26px/1 var(--dsp);color:var(--soul)}
.ch.lk b{color:#6a6258}.ch.lk.on b{color:var(--dim)}.ch b small{font:500 14px/1 var(--txt);color:var(--dim);margin-left:8px}
.ch .cps{display:none}.ch.on .cps{display:block;max-width:44ch;margin-top:6px;font-size:15px;color:var(--soul)}
.act.sm{padding:8px 14px;font-size:16px}
.sv{color:#cfd6e6;font-weight:700}.au{color:var(--gold)}
.svb{margin:0 0 18px}.svb>b{display:block;font:600 26px/1.2 var(--txt)}.svb div{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:4px;font-size:15px;color:var(--dim)}.svb div b{color:var(--bone)}.svb p{margin:8px 0 0;font-size:15px;color:var(--soul)}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:10px 36px;text-align:left}
.mrow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(94,88,80,.35)}
.mrow b{display:block;font-size:17px}.mrow span{font-size:14px;color:var(--dim)}.mrow .rw{color:#cfd6e6;font-weight:600;white-space:nowrap}
.mrow.dn b{color:var(--dim);text-decoration:line-through}.mrow.dn .rw{color:var(--dim)}
.pips{display:flex;gap:4px}.pips i{width:10px;height:10px;box-shadow:inset 0 0 0 1.5px var(--iron)}.pips i.on{background:var(--soul);box-shadow:none}
.narrow{width:min(560px,100%)}
.setg{display:flex;flex-direction:column;gap:16px;margin-top:22px;text-align:left}
.sset{display:grid;grid-template-columns:160px 1fr 64px;align-items:center;gap:14px;font-size:17px}.sset b{text-align:right;font-variant-numeric:tabular-nums}
.sset input{width:100%;accent-color:var(--ember)}.sset .seg{grid-column:2/4}
.chk{display:flex;gap:10px;align-items:center;font-size:17px}.chk input{width:18px;height:18px;accent-color:var(--ember)}
.seg{display:flex}.seg button{flex:1;border:0;padding:9px 0;font:600 16px/1 var(--txt);background:transparent;color:var(--dim);box-shadow:inset 0 0 0 1px var(--iron)}.seg button.on{background:var(--bone);color:var(--ink)}
.setg .hint{margin:0;font-size:14px;color:var(--dim)}
.trn{text-align:center}.trn h2{font-size:clamp(64px,10vw,120px)}.trn>p:first-child{margin:0 0 6px;font-size:18px;color:var(--dim)}
.pr{font-weight:700;color:var(--gold)}.pr.no{color:#d98070}.cd.dis{opacity:.62}
.psv{max-width:62ch;margin:-4px 0 0;font-size:16px;color:var(--soul)}
@media (max-width:760px){#obj{max-width:52vw;padding:8px 10px;font-size:12.5px}#obj b{font-size:17px}.mcols{grid-template-columns:1fr}.sset{grid-template-columns:1fr 56px}.sset span{grid-column:1/3}.sset .seg{grid-column:1/3}#goal{font-size:14px;max-width:62vw}#stn{display:none}}

/* kart girişleri ve sandık açılışı */
.lu .cs .cd{animation:cin .4s cubic-bezier(.2,.9,.3,1.15) both}
.lu .cs .cd:nth-child(2){animation-delay:.07s}.lu .cs .cd:nth-child(3){animation-delay:.14s}.lu .cs .cd:nth-child(4){animation-delay:.21s}
@keyframes cin{0%{opacity:0;transform:translateY(28px) scale(.9)}100%{opacity:1;transform:none}}
.lu .cs.rev .cd{animation:crev .9s cubic-bezier(.2,.9,.25,1.2) both}
.cs.rev .cd::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.32) 50%,transparent 65%);background-size:250% 100%;background-position:130% 0;animation:cshine 1.1s .35s ease-out both}
.cs.rev .cd::after{content:'';position:absolute;inset:-3px;pointer-events:none;box-shadow:0 0 0 2px var(--rc),0 0 46px 6px var(--rc);opacity:0;animation:cglow 1.8s .2s ease-out both}
@keyframes crev{0%{opacity:0;transform:perspective(700px) rotateY(95deg) scale(.7);filter:brightness(3)}55%{opacity:1;transform:perspective(700px) rotateY(-8deg) scale(1.06);filter:brightness(1.6)}100%{transform:none;filter:none}}
@keyframes cshine{0%{background-position:130% 0}100%{background-position:-30% 0}}
@keyframes cglow{0%{opacity:0}25%{opacity:1}100%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.lu .cs .cd,.cs.rev .cd,.cs.rev .cd::before,.cs.rev .cd::after{animation:none}.cs.rev .cd::after{opacity:.35}}
#kl{margin-top:10px;display:flex;flex-direction:column;align-items:flex-end;line-height:1}
#klv{font:600 30px/1 var(--txt);font-variant-numeric:tabular-nums;color:var(--bone);text-shadow:0 2px 4px rgba(0,0,0,.6)}
#kl span{font-size:13px;color:var(--dim);margin-top:3px}
#klr{font-size:13px;color:var(--ember);margin-top:5px;font-variant-numeric:tabular-nums}
.dn.sv{font-size:17px;color:#e6edf4;text-shadow:0 2px 3px #000,0 0 8px rgba(200,225,255,.7)}
.lbt{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:14px 0 4px}
.lbt button{all:unset;cursor:pointer;padding:7px 14px;border:1px solid rgba(221,211,188,.18);font-size:15px;color:var(--dim)}
.lbt button:hover{color:var(--bone)}
.lbt button.on{color:var(--bone);border-color:var(--ember);background:rgba(226,112,44,.12)}
.lbt button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.lbl{display:grid;grid-template-columns:2em 26px minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:16px}
