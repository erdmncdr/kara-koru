<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Kara Koru</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Signika:wght@400;500;600;700&family=Noto+Sans+Old+Turkic&display=swap" rel="stylesheet">
<style>
/* açılış yüklemesi (ui/yukle.js): paket inmeden görünsün diye stil burada */
#yuk{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:24px;background:radial-gradient(120% 90% at 50% 0%,#2a1c14 0%,#120c09 55%,#070504 100%);color:#fff;transition:opacity .35s ease}
#yuk.git{opacity:0;pointer-events:none}
#yuk .yk{width:min(420px,100%);display:flex;flex-direction:column;align-items:center;gap:18px}
#yuk b{font:400 clamp(44px,11vw,68px)/.95 "Alfa Slab One",Georgia,serif;letter-spacing:.01em;color:#fff;-webkit-text-stroke:6px #131417;paint-order:stroke fill;text-shadow:0 5px 0 rgba(0,0,0,.45)}
#yuk .yb{position:relative;width:100%;height:16px;border:2px solid #000;border-radius:4px;background:rgba(34,24,18,.92);box-shadow:0 4px 0 rgba(0,0,0,.45);overflow:hidden}
#yuk .yb i{position:absolute;inset:0;background:#e3a93b;transform:scaleX(0);transform-origin:0 50%;transition:transform .2s ease-out}
#yuk.bel .yb i{width:34%;transform:none;animation:yukak 1.15s ease-in-out infinite alternate}
#yuk p{margin:0;font:600 15px/1.2 "Signika","Trebuchet MS",sans-serif;color:#cfc6ba;font-variant-numeric:tabular-nums}
@keyframes yukak{from{left:0}to{left:66%}}
@media (prefers-reduced-motion:reduce){#yuk,#yuk .yb i{transition:none}#yuk.bel .yb i{animation:none;width:100%;opacity:.35}}
</style>
</head><body>
<div id="yuk" class="bel" role="progressbar" aria-label="Oyun yükleniyor"><div class="yk"><b>Kara Koru</b><div class="yb"><i id="yukc"></i></div><p id="yukt">Yükleniyor…</p></div></div>
<div id="hud">
 <div id="xpw"><div id="xpm"><div id="xpbar"><i id="xp"></i></div><p class="xl"><span id="xpt"></span></p></div></div>

  <div class="bar hpb"><div class="trk"><i id="hp"></i><i id="shdb"></i></div><b id="hpt"></b></div>

 <div id="ct">

 <div id="rt"><div id="rth"><span id="aun" title="Sıradaki sandığın fiyatı"></span><span id="lvb">1</span></div><canvas id="mm" width="150" height="150"></canvas><div id="lgd"></div></div>
