# Netlify: GitHub deposuna bağlı. Kredi (ücretsiz plan ayda 300, her başarılı yayın 15) boşa gitmesin diye her main
# gönderimi yayınlanmaz: yalnız son commit mesajı [yayinla] ile başlarsa derlenir. Diğerleri "ignore" ile atlanır
# (atlanan derleme kredi harcamaz). Yayınlamak için: git commit --allow-empty -m "[yayinla] ..." && git push
# Ortak sıralama için Netlify panelinde (Site configuration → Environment variables) iki değişken:
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY  (README, Ortak sıralama). Yoksa oyun yalnız yerel rekorla çalışır.
[build]
  command = "npm run build"
  publish = "dist"
  # çıkış 0 = derlemeyi atla, 1 = derle
  # etiket mesajın başında olmalı: mesaj içinde kurala değinen commit'ler yanlışlıkla yayınlanmasın
  ignore = "git log -1 --pretty=%s | grep -q '^\\[yayinla\\]' && exit 1 || exit 0"

[build.environment]
  NODE_VERSION = "22"

# Vite çıktısındaki dosya adları içerik özetli: uzun süre önbellekte kalabilir
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# sayfanın kendisi her açılışta yeniden doğrulanır (yeni sürüm hemen gelsin)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# yönetim paneli (ayrı sayfa, ayrı paket): her açılışta yeniden doğrulanır, arama motorlarına kapalı
[[headers]]
  for = "/yonetim.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"
